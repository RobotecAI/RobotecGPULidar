name: build-and-test

run-name: Build & test for ${{ github.ref_name }} on ${{ github.sha }}

# No pull_request trigger because the jobs run on self-hosted runners
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Forks have neither the self-hosted runners nor the OptiX secret
  build-core:
    if: github.repository == 'RobotecAI/RobotecGPULidar'
    uses: ./.github/workflows/build-subworkflow.yml
    with:
      artifact-name: rgl-core
    secrets:
      OPTIX_URL: ${{ secrets.OPTIX_URL }}

  build-ros2:
    if: github.repository == 'RobotecAI/RobotecGPULidar'
    uses: ./.github/workflows/build-subworkflow.yml
    with:
      with-ros2: true
      artifact-name: rgl-ros2
    secrets:
      OPTIX_URL: ${{ secrets.OPTIX_URL }}

  test-core:
    needs: [build-core]
    uses: ./.github/workflows/test-subworkflow.yml
    with:
      artifact-name: rgl-core

  test-ros2:
    needs: [build-ros2]
    uses: ./.github/workflows/test-subworkflow.yml
    with:
      with-ros2: true
      artifact-name: rgl-ros2
