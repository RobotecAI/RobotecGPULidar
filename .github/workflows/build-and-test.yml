name: build-and-test

run-name: Build & test for ${{ github.ref_name }} on ${{ github.sha }}

# No pull_request trigger: pushes to branches of this repository already run it
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Add some other change
jobs:
  build-core:
    uses: ./.github/workflows/build-subworkflow.yml
    with:
      artifact-name: rgl-core

  build-ros2:
    uses: ./.github/workflows/build-subworkflow.yml
    with:
      with-ros2: true
      artifact-name: rgl-ros2

  # Forks have no access to the GPU runner the tests need
  test-core:
    needs: [build-core]
    if: github.repository == 'RobotecAI/RobotecGPULidar'
    uses: ./.github/workflows/test-subworkflow.yml
    with:
      artifact-name: rgl-core

  test-ros2:
    needs: [build-ros2]
    if: github.repository == 'RobotecAI/RobotecGPULidar'
    uses: ./.github/workflows/test-subworkflow.yml
    with:
      with-ros2: true
      artifact-name: rgl-ros2
